[project]
name = "flask-backend-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mwaura-mwangi", email = "fmwauramwangi@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "flask-restx>=1.3.2",
    "flask-sqlalchemy>=3.1.1",
    "python-decouple>=3.8",
]

[project.scripts]
flask-backend-server = "flask_backend_server:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
